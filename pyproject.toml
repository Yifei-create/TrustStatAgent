[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truststatagent"
version = "0.1.0"
description = "Reproducible TrustStatAgent experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
